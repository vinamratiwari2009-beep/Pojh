<!DOCTYPE html>
<html>
<head>
    <title>KingXGodhu Admin Panel</title>
    <!-- CSS SECTION -->
    <style>
        /* ========== RESET ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* ========== BODY ========== */
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: white;
            padding: 20px;
        }
        
        /* ========== CONTAINER ========== */
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* ========== HEADER ========== */
        .header {
            background: #16213e;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        
        /* ========== STATS GRID ========== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #16213e;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }
        .stat-card .number { 
            font-size: 36px; 
            font-weight: bold; 
            color: #e94560; 
        }
        
        /* ========== PANEL ========== */
        .panel {
            background: #16213e;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        
        /* ========== FORM ========== */
        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-group input, .form-group select {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0f3460;
            color: white;
        }
        .form-group select option { background: #16213e; }
        
        /* ========== BUTTONS ========== */
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-primary { background: #e94560; color: white; }
        .btn-success { background: #2ecc71; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        
        /* ========== TABLE ========== */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #0f3460;
        }
        th { background: #0f3460; }
        
        /* ========== BADGES ========== */
        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
        }
        .badge-active { background: #2ecc71; color: white; }
        .badge-inactive { background: #e74c3c; color: white; }
        .badge-expired { background: #95a5a6; color: white; }
        
        /* ========== ACTIONS ========== */
        .actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .actions .btn { padding: 6px 12px; font-size: 11px; }
        
        /* ========== CODE ========== */
        code { 
            background: #0f3460; 
            padding: 2px 6px; 
            border-radius: 4px; 
            font-size: 12px; 
        }
    </style>
</head>

<!-- ============================================ -->
<!-- HTML BODY -->
<!-- ============================================ -->
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>👑 KingXGodhu API Admin</h1>
            <p>Generate keys with expiry & endpoint restrictions | Port: 8080</p>
        </div>
        
        <!-- STATISTICS -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="number" id="totalKeys">0</div>
                <p>Total Keys</p>
            </div>
            <div class="stat-card">
                <div class="number" id="activeKeys">0</div>
                <p>Active Keys</p>
            </div>
            <div class="stat-card">
                <div class="number" id="totalUsage">0</div>
                <p>Total API Calls</p>
            </div>
            <div class="stat-card">
                <div class="number" id="expiredKeys">0</div>
                <p>Expired Keys</p>
            </div>
        </div>
        
        <!-- GENERATE KEY FORM -->
        <div class="panel">
            <h2>🔑 Generate New Key</h2>
            <form onsubmit="generateKey(event)">
                <div class="form-group">
                    <input type="text" id="keyName" placeholder="Key Name" />
                    <input type="number" id="rateLimit" placeholder="Rate Limit" value="1000" />
                    <input type="number" id="expiresIn" placeholder="Expiry (days)" />
                    <select id="endpointSelect">
                        <option value="all">All Endpoints</option>
                        <option value="/api/number">Phone - Number</option>
                        <option value="/api/email">Phone - Email</option>
                        <option value="/api/aadhar">Phone - Aadhar</option>
                        <option value="/api/adv">Phone - Advanced</option>
                        <option value="/api/numleak">Phone - Leak</option>
                        <option value="/api/upi">Finance - UPI</option>
                        <option value="/api/numtoupi">Finance - Number to UPI</option>
                        <option value="/api/ifsc">Finance - IFSC</option>
                        <option value="/api/pan">Finance - PAN</option>
                        <option value="/api/pincode">Location - Pincode</option>
                        <option value="/api/ip">Location - IP</option>
                        <option value="/api/vehicle">Vehicle - Details</option>
                        <option value="/api/veh2num">Vehicle - Number</option>
                        <option value="/api/challan">Vehicle - Challan</option>
                        <option value="/api/ff">Gaming - Free Fire</option>
                        <option value="/api/bgmi">Gaming - BGMI</option>
                        <option value="/api/adharfamily">OSINT - Family</option>
                        <option value="/api/leakinfo">OSINT - Leak</option>
                        <option value="/api/bomber">SMS - Bomber</option>
                        <option value="/api/pk">Pakistan - SIM</option>
                    </select>
                    <button type="submit" class="btn btn-primary">Generate</button>
                </div>
            </form>
        </div>
        
        <!-- KEYS TABLE -->
        <div class="panel">
            <h2>📋 All Keys</h2>
            <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Key</th>
                        <th>Name</th>
                        <th>Rate Limit</th>
                        <th>Used</th>
                        <th>Expires</th>
                        <th>Endpoint</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="keysTable"></tbody>
            </table>
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- JAVASCRIPT SECTION -->
    <!-- ============================================ -->
    <script>
        // ============================================
        // SECTION 1: LOAD STATISTICS
        // ============================================
        async function loadStats() {
            const res = await fetch('/admin-panel/stats');
            const data = await res.json();
            if (data.success) {
                document.getElementById('totalKeys').textContent = data.data.totalKeys;
                document.getElementById('activeKeys').textContent = data.data.activeKeys;
                document.getElementById('totalUsage').textContent = data.data.totalUsage;
                
                const keysRes = await fetch('/admin-panel/keys');
                const keysData = await keysRes.json();
                if (keysData.success) {
                    const expired = keysData.data.filter(k => k.expiresAt && new Date(k.expiresAt) < new Date()).length;
                    document.getElementById('expiredKeys').textContent = expired;
                }
            }
        }
        
        // ============================================
        // SECTION 2: LOAD KEYS TABLE
        // ============================================
        async function loadKeys() {
            const res = await fetch('/admin-panel/keys');
            const data = await res.json();
            if (data.success) {
                const tbody = document.getElementById('keysTable');
                tbody.innerHTML = data.data.map(key => {
                    const isExpired = key.expiresAt && new Date(key.expiresAt) < new Date();
                    const status = !key.isActive ? 'Inactive' : 
                                 isExpired ? 'Expired' : 'Active';
                    const statusClass = !key.isActive ? 'badge-inactive' :
                                      isExpired ? 'badge-expired' : 'badge-active';
                    
                    return `
                    <tr>
                        <td><code>${key.key}</code></td>
                        <td>${key.name}</td>
                        <td>${key.rateLimit}</td>
                        <td>${key.usageCount}</td>
                        <td>${key.expiresAt ? new Date(key.expiresAt).toLocaleDateString() : 'Never'}</td>
                        <td>${key.allowedEndpoints.includes('all') ? 'All' : key.allowedEndpoints.join(', ')}</td>
                        <td><span class="badge ${statusClass}">${status}</span></td>
                        <td>
                            <div class="actions">
                                <button class="btn btn-warning" onclick="editKey('${key.key}')">Edit</button>
                                <button class="btn ${key.isActive ? 'btn-danger' : 'btn-success'}" 
                                        onclick="toggleKey('${key.key}')">
                                    ${key.isActive ? 'Deactivate' : 'Activate'}
                                </button>
                                <button class="btn btn-danger" onclick="deleteKey('${key.key}')">Delete</button>
                            </div>
                        </td>
                    </tr>
                `}).join('');
            }
        }
        
        // ============================================
        // SECTION 3: GENERATE KEY
        // ============================================
        async function generateKey(e) {
            e.preventDefault();
            const name = document.getElementById('keyName').value;
            const rateLimit = document.getElementById('rateLimit').value || 1000;
            const expiresIn = document.getElementById('expiresIn').value || null;
            const endpoint = document.getElementById('endpointSelect').value;
            
            const res = await fetch('/admin-panel/generate-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    name, 
                    rateLimit: parseInt(rateLimit),
                    expiresIn: parseInt(expiresIn),
                    allowedEndpoints: [endpoint]
                })
            });
            const data = await res.json();
            if (data.success) {
                alert('✅ Key generated!\n\nKey: ' + data.data.key + 
                      '\nRate Limit: ' + data.data.rateLimit +
                      '\nExpires: ' + (data.data.expiresAt ? new Date(data.data.expiresAt).toLocaleDateString() : 'Never') +
                      '\nEndpoint: ' + data.data.allowedEndpoints.join(', '));
                loadKeys();
                loadStats();
                document.getElementById('keyName').value = '';
                document.getElementById('expiresIn').value = '';
            }
        }
        
        // ============================================
        // SECTION 4: EDIT KEY
        // ============================================
        async function editKey(keyId) {
            const newLimit = prompt('Enter new rate limit:');
            if (!newLimit) return;
            const newExpiry = prompt('Enter new expiry (days, or 0 for never):');
            if (newExpiry === null) return;
            
            const res = await fetch(`/admin-panel/update-key/${keyId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    rateLimit: parseInt(newLimit),
                    expiresIn: parseInt(newExpiry) || null
                })
            });
            if (res.ok) {
                alert('✅ Key updated!');
                loadKeys();
                loadStats();
            }
        }
        
        // ============================================
        // SECTION 5: TOGGLE KEY
        // ============================================
        async function toggleKey(keyId) {
            if (!confirm('Toggle this key?')) return;
            const res = await fetch(`/admin-panel/toggle-key/${keyId}`, { method: 'PATCH' });
            if (res.ok) {
                loadKeys();
                loadStats();
            }
        }
        
        // ============================================
        // SECTION 6: DELETE KEY
        // ============================================
        async function deleteKey(keyId) {
            if (!confirm('Delete this key?')) return;
            const res = await fetch(`/admin-panel/delete-key/${keyId}`, { method: 'DELETE' });
            if (res.ok) {
                loadKeys();
                loadStats();
            }
        }
        
        // ============================================
        // SECTION 7: INITIALIZE
        // ============================================
        loadStats();
        loadKeys();
    </script>
</body>
  </html>
